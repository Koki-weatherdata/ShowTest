<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECMWF 海面更正気圧 予報</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ECMWF 海面更正気圧 (MSL)</h1>
        <p class="subtitle">ECMWFから取得（CC BY 4.0）</p>
        
        <div class="viewer">
            <!-- 予測時間表示 -->
            <div class="time-label">Forecast Time: <span id="ft-display">FT=006h</span></div>
            
            <!-- 画像表示エリア -->
            <div class="image-container">
                <img id="weather-image" alt="マップ" src="">
                <div id="loading" class="loading">画像を読み込み中...</div>
            </div>

            <!-- コントロールエリア -->
            <div class="controls">
                <button id="play-btn">▶ 再生</button>
                <input type="range" id="time-slider" min="0" max="23" value="0" step="1">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
