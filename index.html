<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECMWF 総観場予報ダッシュボード</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ECMWF 総観場予報</h1>
        
        <div class="header-controls">
            <div class="cycle-selector">
                <label for="cycle-select">初期値 (Init):</label>
                <select id="cycle-select" disabled>
                    <option>読み込み中...</option>
                </select>
            </div>
            <div class="time-label">
                Valid Time: <span id="valid-time-display">--</span>
                <span id="step-display" class="step-badge">FT=--</span>
            </div>
        </div>
        
        <div class="viewer">
            <div class="dual-images">
                <div class="image-box">
                    <div class="image-header">
                        <select id="var-select-left" class="var-select"></select>
                    </div>
                    <img id="img-left" alt="Left View" src="">
                </div>
                <div class="image-box">
                    <div class="image-header">
                        <select id="var-select-right" class="var-select"></select>
                    </div>
                    <img id="img-right" alt="Right View" src="">
                </div>
            </div>

            <div class="controls">
                <button id="play-btn">▶ 再生</button>
                <div id="ft-band" class="ft-band"></div>
            </div>
        </div>
    </div>
    <script src="script.js?v=7"></script>
</body>
</html>
