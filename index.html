<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECMWF Forcast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>CC BY 4.0</h1>
        <p class="init-time" id="init-time-display">初期値: 読み込み中...</p>
        
        <div class="viewer">
            <div class="time-label">
                予測時刻: <span id="valid-time-display">--</span>
                <span id="step-display" class="step-badge">FT=--</span>
            </div>
            
            <div class="dual-images">
                <div class="image-box">
                    <div class="image-title">500hPa 高度・絶対渦度</div>
                    <img id="img-500" alt="500hPa 予報図" src="">
                </div>
                <div class="image-box">
                    <div class="image-title">地上気圧・850hPa 気温・風</div>
                    <img id="img-850" alt="850hPa 予報図" src="">
                </div>
            </div>

            <div class="controls">
                <button id="play-btn">▶ 再生</button>
                <input type="range" id="time-slider" min="0" max="0" value="0" step="1" disabled>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
