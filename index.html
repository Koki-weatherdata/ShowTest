<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>つくば市の気象データ</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: white;
        }
    </style>
</head>
<body>
    <h1>つくば市の気象データ</h1>
    <p>この画像は Google Cloud 上で3時間ごとに自動生成</p>
    
    <!-- 画像を表示する場所 -->
    <img id="weather-image" alt="気象データグラフ">

    <script>
        // ページを開いた時に、キャッシュを回避して最新画像を自動読み込みする
        window.onload = function() {
            const img = document.getElementById('weather-image');
            const bucketName = "test-images-2026"; 
            const baseUrl = `https://storage.googleapis.com/${bucketName}/weather.png`;
            
            // 末尾に現在時刻を付与してキャッシュを回避
            img.src = `${baseUrl}?t=${new Date().getTime()}`;
        };
    </script>
</body>
</html>
